name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean CampaignForge.spec

      - name: Package artifact
        shell: powershell
        run: Compress-Archive -Path dist\CampaignForge.exe -DestinationPath CampaignForge-Windows-Portable.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampaignForge-Windows-Portable
          path: CampaignForge-Windows-Portable.zip

      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CampaignForge-Windows-Portable.zip
