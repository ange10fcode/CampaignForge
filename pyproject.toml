[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaignforge"
version = "1.1.0"
description = "Terrain-aware hierarchical procedural world and battle-map editor for tabletop campaigns"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10.0"]
keywords = ["dnd", "tabletop", "map-generator", "procedural-generation", "campaign"]

[project.scripts]
campaignforge = "campaignforge.app:main"

[tool.setuptools.packages.find]
include = ["campaignforge*"]
